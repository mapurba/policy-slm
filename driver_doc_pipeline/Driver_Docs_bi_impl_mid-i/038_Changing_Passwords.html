<h1 class="title h1"><span class="number">7.5</span> Changing Passwords</h1>

<div class="content_wrapper">

<p class="para">To publish password change information, you must change passwords with a method that uses the Validate Password exit program. The driver obtains password change information from this exit. Administrative password resets must be performed in the Identity Vault.</p>
