<h1 class="title h1"><span class="number">8.4</span> Uninstalling the Driver on Windows Reports a Java Virtual Machine Error</h1>

<div class="content_wrapper">

<p class="para">The driver uninstallation program only supports a 32-bit Java path. Ensure that you set the 32-bit Java path in the environmental variables to load the uninstallation program for a 64-bit Windows operating system.</p>
