<h1 class="title h1"><span class="number">2.5</span> Starting ActiveMQ</h1>

<div class="content_wrapper">

<p class="para">To start an ActiveMQ instance, navigate to <span class="filename">&lt;activemq unzipped path&gt;/bin</span> and perform one of the following actions:</p>
<div class="itemizedlist">
<ul class="listbullet">
<li class="listitem">
<div class="formalpara">
            <p class="title"><em class="title">Linux:</em>
            Run the<span class="command">./activemq start</span> command.</p>
          </div>
</li>
<li class="listitem">
<div class="formalpara">
            <p class="title"><em class="title">Windows:</em>
            Run the<span class="command">.activemq.bat start</span> command.</p>
          </div>
</li></ul></div>

</div>
