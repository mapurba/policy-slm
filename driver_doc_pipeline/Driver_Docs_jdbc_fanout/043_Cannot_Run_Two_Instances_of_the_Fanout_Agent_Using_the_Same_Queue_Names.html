<h1 class="title h1"><span class="number">7.6</span> Cannot Run Two Instances of the Fanout Agent Using the Same Queue Names</h1>

<div class="content_wrapper">

<p class="para">For multiple Fanout agents, you require equal number of ActiveMQs. In case the same ActiveMQ is used for multiple Fanout agents, manually clean the ActiveMQ queues before using a different Fanout agent.</p>
