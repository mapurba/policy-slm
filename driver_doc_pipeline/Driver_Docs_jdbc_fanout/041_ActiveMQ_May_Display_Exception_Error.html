<h1 class="title h1"><span class="number">7.4</span> ActiveMQ May Display Exception Error</h1>

<div class="content_wrapper">

<p class="para">ActiveMQ may display an exception error while it is viewing a queue with an unprocessed event. This issue is randomly observed.</p>
<p class="para">To workaround this issue, install the latest patch from the <a href="https://issues.apache.org/jira/browse/AMQ-5356" class="ulink">ActiveMQ web site</a>.</p>
