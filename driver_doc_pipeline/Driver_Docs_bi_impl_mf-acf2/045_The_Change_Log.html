<h1 class="title h1"><span class="number">8.5</span> The Change Log</h1>

<div class="content_wrapper">

<p class="para">The change log data set contains information about events on the connected system, including passwords. It is encrypted, but it should be protected against access by unauthorized users.</p>
<p class="para">Ensure that the change log data set is appropriately protected.</p>
