<h1 class="title h1"><span class="number">2.1</span> System Requirements</h1>

<div class="content_wrapper">

<p class="para">The Epic driver requires a minimum version of Identity Manager 4.7. If entitlements are being used, then IDM 4.7 Advanced Edition or newer is required.</p>
<p class="para">The Epic driver will run on the IDM engine or on a remote loader.</p>
