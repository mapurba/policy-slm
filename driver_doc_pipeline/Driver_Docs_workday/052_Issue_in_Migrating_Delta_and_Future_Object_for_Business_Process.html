<h1 class="title h1"><span class="number">9.9</span> Issue in Migrating Delta and Future Object for Business Process</h1>

<div class="content_wrapper">

<p class="para"><span class="strong">Issue</span>: The delta and future objects will not be migrated when the <span class="guimenu">Enable Delta and Future Object Creation</span> is set to <span class="guimenu">True</span>.</p>
<p class="para"><span class="strong">Workaround</span>: For a successful migration, it is mandatory to set the <span class="guimenu">Migrate on Startup</span> option to <span class="guimenu">True</span>.</p>
