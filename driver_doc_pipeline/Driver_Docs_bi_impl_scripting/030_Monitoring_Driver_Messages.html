<h1 class="title h1"><span class="number">6.4</span> Monitoring Driver Messages</h1>

<div class="content_wrapper">

<p class="para">The Scripting driver writes messages to the system log on Linux and UNIX, and the trace file on Windows (<span class="filename">trace.log</span> in the logs directory by default). For details about the messages written by the driver, see <a href="b8noakn.html" class="xref">Section B.0, System and Error Messages</a>.</p>
