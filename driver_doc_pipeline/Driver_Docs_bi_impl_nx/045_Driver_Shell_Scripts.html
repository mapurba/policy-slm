<h1 class="title h1"><span class="number">8.6</span> Driver Shell Scripts</h1>

<div class="content_wrapper">

<p class="para">The driver uses shell scripts to perform updates on the connected system, and to collect changes made there.</p>
<p class="para">Ensure that the script directory <span class="filename">/usr/local/nxdrv/scripts</span> is appropriately protected. The installation program sets secure file permissions for this directory.</p>
