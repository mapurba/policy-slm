<div class="content_wrapper">

<div class="procedure" id="b3xfufn">
<ol class="steps">
<li class="step" id="b3xfufo">
<p class="para">To remove the driver shim and the PAM or LAM module from the connected system, run <span class="command">/usr/sbin/nxdrv-uninstall</span>.</p></li>
<li class="step" id="b3xfuyu">
<p class="para">To remove the Driver object from eDirectory, click <span class="guimenu">Delete Driver</span> on the Identity Manager Overview page in iManager.</p></li></ol>
