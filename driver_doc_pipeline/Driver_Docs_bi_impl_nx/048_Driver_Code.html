<h1 class="title h1"><span class="number">8.9</span> Driver Code</h1>

<div class="content_wrapper">

<p class="para">Ensure that the driver executable directory <span class="filename">/usr/local/nxdrv/bin</span> and the driver files in <span class="filename">/usr/sbin</span> are appropriately protected. The installation program sets secure file permissions for this directory and for the driver files added to <span class="filename">/usr/sbin</span>.</p>
